<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaStudy · Timed assessment</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#1b2634;background:#f5f3ee}*{box-sizing:border-box}body{margin:0}.top{background:#173d3c;color:white;padding:16px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:700}.brand b{display:inline-block;background:#247968;padding:4px 9px;border-radius:7px;margin-right:9px}.top small{color:#b5d2c3;letter-spacing:.1em}.nav{background:white;border-bottom:1px solid #dce3dd;padding:9px 4%;font-size:12px;color:#176b5c;font-weight:700}main{max-width:950px;margin:24px auto;padding:0 18px}.eyebrow{color:#176b5c;font-size:11px;font-weight:800;letter-spacing:.12em}h1{margin:5px 0 18px;font-size:28px}.shell{border:1px solid #dce3dd;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 12px 30px #173d3c0c}.examhead{background:#1a1a1a;color:white;padding:17px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center}.examhead h2{margin:0;font-size:18px}.examhead small{color:#aab6b0}.progress{background:#222;color:#bfc9c3;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.progress span{font-size:12px;font-weight:700}.clock{padding:8px 13px;border-radius:7px;background:#176b5c;color:white;font-size:18px;font-weight:800;min-width:67px;text-align:center}.track{height:4px;background:#e7eee8}.track i{display:block;height:100%;background:#247968;transition:width .2s}.content{padding:25px;min-height:290px}.card{padding:25px;border:1px solid #e5e9e3;border-radius:12px;box-shadow:0 8px 20px #173d3c09}.number{color:#176b5c;font-size:11px;font-weight:800;letter-spacing:.1em}.question{font-size:18px;font-weight:600;line-height:1.45;margin:10px 0 20px}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid #dce5de;border-radius:8px;cursor:pointer}.choice:has(input:checked){background:#eaf4ed;border-color:#247968}.choice input{accent-color:#176b5c;margin-top:3px}.choice b{min-width:22px}.foot{padding:14px 25px;border-top:1px solid #edf0eb;display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{background:#1a1a1a;color:white;border:0;border-radius:7px;padding:11px 15px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:#176b5c;border:1px solid #cbded3}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{color:#65776a;font-size:12px}.reviewlist{display:grid;gap:13px}.reviewitem{padding:15px;border:1px solid #e1e8e1;border-radius:9px}.reviewitem .question{font-size:14px;margin:5px 0 12px}.reviewitem .choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.reviewitem .choice{font-size:12px;padding:8px}.result{text-align:center;padding:45px 20px}.result strong{font-size:25px;color:#176b5c}.reset{margin-top:13px;border:0;background:none;color:#176b5c;text-decoration:underline;cursor:pointer;font-size:12px}@media(max-width:600px){.top small{display:none}.content{padding:13px}.card{padding:17px}.foot{padding:13px}.reviewitem .choices{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><b>▣</b>nova study</div><small>ASSESSMENT WORKSPACE</small></header><div class="nav">MY ASSESSMENTS / ACTIVE SESSION</div><main><span class="eyebrow">WORKSPACE / MY ASSESSMENTS</span><h1>Timed assessment</h1><section class="shell" aria-label="Offline assessment preview"><div class="examhead"><div><h2>Environmental foundations</h2><small>Demonstration attempt · fictional questions</small></div><small>EXIT SESSION</small></div><div class="progress"><span id="phase">QUESTION 1 OF 3</span><time class="clock" id="clock" aria-label="Time remaining">00:45</time></div><div class="track"><i id="bar"></i></div><div class="content" id="content"></div><div class="foot"><span id="hint" class="hint" role="status"></span><button id="next" type="button" class="btn">Next question →</button></div></section><button id="reset" type="button" class="reset">Reset preview</button></main><script>
const questions=[{text:'Which observation best identifies a watershed boundary?',choices:[['A','A drainage divide separating flow directions'],['B','The deepest point in a river'],['C','The location of a rain gauge']],answer:'A'},{text:'Why should a field team record weather during sampling?',choices:[['A','To avoid writing a site description'],['B','To interpret conditions that may affect results'],['C','To replace the sample labels'],['D','To calculate a map scale']],answer:'B'},{text:'A chart shows a sharp increase after heavy rain. What is the most defensible next step?',choices:[['A','Treat the rise as proof of one cause'],['B','Remove the unusual measurement'],['C','Check the timing and compare related observations']],answer:'C'}];let answers,index,mode,seconds,interval;const content=document.getElementById('content'),next=document.getElementById('next'),clock=document.getElementById('clock'),phase=document.getElementById('phase'),bar=document.getElementById('bar'),hint=document.getElementById('hint');function tick(){seconds--;if(seconds<=0){if(mode==='question')advance();else if(mode==='review')finish();return}paintTime()}function paintTime(){clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');clock.style.background=seconds<=10?'#a6443d':'#176b5c'}function startTimer(n){clearInterval(interval);seconds=n;paintTime();interval=setInterval(tick,1000)}function choiceList(q,i){const box=document.createElement('div');box.className='choices';q.choices.forEach(([label,text])=>{const option=document.createElement('label');option.className='choice';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=label;input.checked=answers[i]===label;input.onchange=()=>{answers[i]=label;hint.textContent='Answer saved in this preview.'};const strong=document.createElement('b');strong.textContent=label+'.';const span=document.createElement('span');span.textContent=text;option.append(input,strong,span);box.append(option)});return box}function render(){content.replaceChildren();if(mode==='done'){phase.textContent='SESSION COMPLETE';bar.style.width='100%';clock.textContent='00:00';const result=document.createElement('div');result.className='result';const correct=questions.filter((q,i)=>answers[i]===q.answer).length;result.innerHTML='<strong>Preview submitted</strong><p></p>';result.querySelector('p').textContent=correct+' of 3 correct in this fictional example. No answer was sent anywhere.';content.append(result);next.hidden=true;hint.textContent='Use Reset preview to try again.';return}if(mode==='question'){const q=questions[index];phase.textContent='QUESTION '+(index+1)+' OF '+questions.length;bar.style.width=(index/questions.length*100)+'%';const card=document.createElement('div');card.className='card';const num=document.createElement('div');num.className='number';num.textContent=phase.textContent;const text=document.createElement('div');text.className='question';text.textContent=q.text;card.append(num,text,choiceList(q,index));content.append(card);next.textContent=index===questions.length-1?'Review answers →':'Next question →';hint.textContent='You may advance before the timer ends.';next.hidden=false;return}phase.textContent='REVIEW PHASE';bar.style.width='100%';const intro=document.createElement('p');intro.textContent='Check unanswered questions or change responses before submitting.';content.append(intro);const list=document.createElement('div');list.className='reviewlist';questions.forEach((q,i)=>{const card=document.createElement('div');card.className='reviewitem';const num=document.createElement('div');num.className='number';num.textContent='QUESTION '+(i+1)+(answers[i]?' · ANSWERED':' · UNANSWERED');const text=document.createElement('div');text.className='question';text.textContent=q.text;card.append(num,text,choiceList(q,i));list.append(card)});content.append(list);next.textContent='Finalize and submit';hint.textContent='All questions are editable during review.'}function advance(){if(mode==='review'){finish();return}index++;if(index>=questions.length){mode='review';startTimer(90)}else startTimer(45);render()}function finish(){clearInterval(interval);mode='done';render()}function reset(){clearInterval(interval);answers={};index=0;mode='question';startTimer(45);render()}next.onclick=advance;document.getElementById('reset').onclick=reset;reset();
</script></body></html>
